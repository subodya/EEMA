<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minimalist Clothing Brand</title>
    <!-- Google Fonts for a clean look -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">

    <style>
        /* CSS Reset & Variables */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary-bg: #ffffff;
            --text-color: #1a1a1a;
            --light-gray: #f5f5f5;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--primary-bg);
            color: var(--text-color);
            line-height: 1.6;
        }

        /* Navigation */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 2rem 5%;
            background-color: var(--primary-bg);
            position: sticky;
            top: 0;
            z-index: 100;
            border-bottom: 1px solid var(--light-gray);
        }

        .logo {
            font-size: 1.5rem;
            font-weight: 600;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        nav a {
            text-decoration: none;
            color: var(--text-color);
            margin-left: 2rem;
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        nav a:hover {
            color: #777;
        }

        /* Hero Section */
        .hero {
            height: 70vh;
            background-color: var(--light-gray);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            /* To add a background image, replace the background-color above with:
            background: url('your-image.jpg') center/cover; */
        }

        .hero h1 {
            font-size: 3rem;
            font-weight: 300;
            margin-bottom: 1rem;
        }

        .hero p {
            font-size: 1.1rem;
            margin-bottom: 2rem;
            color: #555;
        }

        .btn {
            padding: 12px 30px;
            background-color: var(--text-color);
            color: var(--primary-bg);
            text-decoration: none;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-size: 0.9rem;
            transition: background 0.3s ease;
        }

        .btn:hover {
            background-color: #444;
        }

        /* Collection Grid */
        .collection {
            padding: 5rem 5%;
            text-align: center;
        }

        .collection h2 {
            font-size: 2rem;
            font-weight: 400;
            margin-bottom: 3rem;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 2rem;
        }

        .product-card {
            text-align: left;
        }

        .product-img {
            width: 100%;
            height: 350px;
            background-color: var(--light-gray);
            margin-bottom: 1rem;
            object-fit: cover;
        }

        .product-title {
            font-size: 1rem;
            font-weight: 400;
            margin-bottom: 0.5rem;
        }

        .product-price {
            font-size: 0.9rem;
            color: #666;
        }

        /* Footer */
        footer {
            text-align: center;
            padding: 3rem 5%;
            background-color: var(--light-gray);
            font-size: 0.8rem;
            color: #555;
        }

        /* Floating WhatsApp Button */
        .whatsapp-float {
            position: fixed;
            bottom: 30px;
            right: 30px;
            background-color: #25D366;
            color: #fff;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            text-decoration: none;
            box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.15);
            z-index: 1000;
            transition: transform 0.3s ease;
        }

        .whatsapp-float:hover {
            transform: scale(1.1);
        }

        /* SVG Icon for WhatsApp */
        .whatsapp-float svg {
            width: 35px;
            height: 35px;
            fill: currentColor;
        }
    </style>
</head>

<body>

    <!-- Header / Navigation -->
    <header>
        <div class="logo">BRAND NAME</div>
        <nav>
            <a href="#">New Arrivals</a>
            <a href="#">Collections</a>
            <a href="#">Sale</a>
        </nav>
    </header>

    <!-- Hero Banner -->
    <section class="hero">
        <h1>The Linen Edit</h1>
        <p>Effortless style for everyday wear.</p>
        <a href="#shop" class="btn">Shop Collection</a>
    </section>

    <!-- Featured Products Grid -->
    <section id="shop" class="collection">
        <h2>Featured Pieces</h2>
        <div class="grid">
            <!-- Product 1 -->
            <div class="product-card">
                <!-- Replace src with your actual image -->
                <img src="https://via.placeholder.com/400x600" alt="Linen Top" class="product-img">
                <h3 class="product-title">Classic Linen Top</h3>
                <p class="product-price">Rs 5,900</p>
            </div>
            <!-- Product 2 -->
            <div class="product-card">
                <img src="https://via.placeholder.com/400x600" alt="Pleated Trousers" class="product-img">
                <h3 class="product-title">Pleated Trousers</h3>
                <p class="product-price">Rs 7,500</p>
            </div>
            <!-- Product 3 -->
            <div class="product-card">
                <img src="https://via.placeholder.com/400x600" alt="Kaftan Dress" class="product-img">
                <h3 class="product-title">Kaftan Dress</h3>
                <p class="product-price">Rs 10,400</p>
            </div>
            <!-- Product 4 -->
            <div class="product-card">
                <img src="https://via.placeholder.com/400x600" alt="Tunic Shirt" class="product-img">
                <h3 class="product-title">Tunic Shirt</h3>
                <p class="product-price">Rs 5,900</p>
            </div>
        </div>
    </section>

    <!-- Footer -->
    <footer>
        <p>&copy; 2026 BRAND NAME. All Rights Reserved.</p>
    </footer>

    <!-- Floating WhatsApp Button -->
    <!-- Replace "94XXXXXXXXX" with your actual WhatsApp number including country code (e.g., 94 for Sri Lanka) -->
    <a href="https://wa.me/94XXXXXXXXX?text=Hello,%20I'm%20interested%20in%20your%20clothing%20collection!"
        class="whatsapp-float" target="_blank" rel="noopener noreferrer">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 448 512">
            <!-- WhatsApp SVG path -->
            <path
                d="M380.9 97.1C339 55.1 283.2 32 223.9 32c-122.4 0-222 99.6-222 222 0 39.1 10.2 77.3 29.6 111L0 480l117.7-30.9c32.4 17.7 68.9 27 106.1 27h.1c122.3 0 224.1-99.6 224.1-222 0-59.3-25.2-115-67.1-157zM223.9 413.6c-33.1 0-65.5-8.9-94-25.7l-6.7-4-69.8 18.3L72 334.3l-4.4-7c-18.5-29.4-28.2-63.3-28.2-98.2 0-101.7 82.8-184.5 184.6-184.5 49.3 0 95.6 19.2 130.4 54.1 34.8 34.9 56.2 81.2 56.1 130.5 0 101.8-84.9 184.4-186.6 184.4zm101.2-138.2c-5.5-2.8-32.8-16.2-37.9-18-5.1-1.9-8.8-2.8-12.5 2.8-3.7 5.6-14.3 18-17.6 21.8-3.2 3.7-6.5 4.2-12 1.4-32.6-16.3-54-29.1-75.5-66-2.1-3.6 2.1-3.2 7.6-14.1 2.8-5.6 1.4-10.6 0-13.4-1.4-2.8-12.5-30.1-17.1-41.2-4.5-10.8-9.1-9.3-12.5-9.5-3.2-.2-6.9-.2-10.6-.2-3.7 0-9.7 1.4-14.8 6.9-5.1 5.6-19.4 19-19.4 46.3 0 27.3 19.9 53.7 22.6 57.4 2.8 3.7 39.1 59.7 94.8 83.8 35.2 15.2 49 16.5 66.6 13.9 10.7-1.6 32.8-13.4 37.4-26.4 4.6-13 4.6-24.1 3.2-26.4-1.3-2.5-5-3.9-10.5-6.6z" />
        </svg>
    </a>

</body>

</html>
