name: Keep Supabase active

# Supabase's free tier pauses a project after ~7 days without database activity.
# This makes one small read (the category list) every 3 days so the shop never pauses.
# Uses the same SUPABASE_URL / SUPABASE_ANON_KEY repository secrets as the deploy.
on:
  schedule:
    - cron: '23 4 */3 * *'   # 04:23 UTC every 3rd day (≈ 09:53 in Sri Lanka)
  workflow_dispatch:           # "Run workflow" button for a manual check

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read one row from Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "::error::Add the SUPABASE_URL and SUPABASE_ANON_KEY repository secrets."
            exit 1
          fi
          status=$(curl -sS -o /tmp/body.json -w '%{http_code}' --retry 3 --retry-delay 10 \
            "${SUPABASE_URL%/}/rest/v1/categories?select=id&limit=1" \
            -H "apikey: ${SUPABASE_ANON_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_ANON_KEY}")
          echo "Supabase responded with HTTP $status"
          if [ "$status" != "200" ]; then
            echo "::error::Supabase did not respond normally (HTTP $status). If the project is paused, restore it in the Supabase dashboard."
            cat /tmp/body.json || true
            exit 1
          fi
