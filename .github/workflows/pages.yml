name: Deploy EEMA Fashion website

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install build tools
        run: npm ci

      # Builds the Tailwind CSS, writes js/supabase-config.js from the repository secrets
      # (Settings → Secrets and variables → Actions → SUPABASE_URL, SUPABASE_ANON_KEY)
      # and adds cache-busting versions to asset links. Same build as Cloudflare Pages.
      - name: Build site
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: npm run build:ci

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload website artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./eema-fashion-website

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
